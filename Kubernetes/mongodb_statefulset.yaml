apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:3.6

          args:
            - "--auth"
            - "--bind_ip_all"

          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

            - name: mongodb-init
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: mongodb-init
          configMap:
            name: mongodb-init

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: mongodb-storage

        resources:
          requests:
            storage: 1Gi