apiVersion: v1
kind: Service

metadata:
  name: namegen-app-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb

  selector:
    app: namegen-app

  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP